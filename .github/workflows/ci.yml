name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: fmt + clippy + test
    # No native Arch runner exists; run inside an archlinux container.
    # Arch ships gtk4-layer-shell (blink's primary Hyprland/Wayland target),
    # so the layer-shell feature builds and is gated here.
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel pkgconf \
            gtk4 glib2 pango gdk-pixbuf2 graphene wayland gtk4-layer-shell

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy -D warnings
        # Gate the same flag set local dev lints with (all targets, all features),
        # so nothing slips through that only shows up with --all-features.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features
