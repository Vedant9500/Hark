[package]
name = "hark"
version = "0.1.0"
edition = "2021"
# Lowest Rust version the dependency tree supports (gtk4/glib 0.20 require 1.70).
# AUR PKGBUILD builds with stable; keep this as a floor, not a target.
rust-version = "1.70"
description = "Raycast-style launcher for Linux (Hyprland/Wayland)"
license = "MIT"
readme = "README.md"
authors = ["Vedant Deshmukh <deshmukhvedant95@gmail.com>"]
repository = "https://github.com/Vedant9500/Hark"
homepage = "https://github.com/Vedant9500/Hark"
keywords = ["launcher", "wayland", "hyprland", "gtk4", "raycast"]
categories = ["gui"]

[lib]
name = "hark"
path = "src/lib.rs"

[[bin]]
name = "hark"
path = "src/main.rs"

[features]
default = []
layer-shell = ["dep:gtk4-layer-shell"]
# Micro-bench CLI (`hark --bench`). Off by default to keep the daemon binary lean.
bench = []

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = { version = "0.5", optional = true }
glib = "0.20"
gio = "0.20"
fuzzy-matcher = "0.3"
walkdir = "2"
dirs = "5"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = true, features = ["filter-by-regex"] }
# Blocking HTTP for FX / translate workers (no curl process spawn).
ureq = { version = "2.12", default-features = true }
# Syntax-highlighted code preview (GtkSourceView 5).
sourceview5 = "0.9"
# Audio ID3/MP4/Vorbis tag + embedded-art reading (pure Rust).
lofty = "0.25"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Optional: `cargo install cargo-deb && cargo deb --release --features layer-shell`
[package.metadata.deb]
name = "hark"
maintainer = "Vedant Deshmukh <deshmukhvedant95@gmail.com>"
copyright = "2026 Vedant Deshmukh"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Hark is a Raycast-style launcher for Linux, built for Hyprland/Wayland.
Search apps, files, do math and unit conversions from a single overlay."""
depends = "$auto"
assets = [
  ["target/release/hark", "usr/bin/", "755"],
  ["packaging/hark.desktop", "usr/share/applications/", "644"],
  ["assets/hark.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["README.md", "usr/share/doc/hark/", "644"],
]
